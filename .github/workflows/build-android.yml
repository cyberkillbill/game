name: Build Android APK

# Build automático do APK debug do Porto Santiago.
#
# - Roda a cada push ou disparo manual ("Run workflow" na aba Actions).
# - Baixa Godot 4.3 stable + templates de export.
# - Instala Android SDK + NDK + build-tools 34.
# - Gera keystore de debug e configura editor_settings.
# - Faz duas passadas de --import (cache de class_name fica completo).
# - Instala o template de build Android (cria pasta android/build/).
# - Exporta o APK debug.
# - Sobe o APK como artifact com retenção de 30 dias.

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**/*.md"
      - ".gitignore"
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"
  GODOT_STATUS: "stable"

jobs:
  android:
    name: Export Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "11076708"

      - name: Install Android SDK packages
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmdline-tools;latest" \
            "ndk;23.2.8568313" \
            "cmake;3.22.1"

      - name: Cache Godot binary and templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}-v2

      - name: Install Godot ${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p ~/godot-bin && cd ~/godot-bin
          GODOT_URL="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip"
          TEMPLATES_URL="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz"

          echo "Downloading Godot from $GODOT_URL"
          curl -L --fail -o godot.zip "$GODOT_URL"
          unzip -o godot.zip
          mv "Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" godot
          chmod +x godot

          echo "Downloading export templates from $TEMPLATES_URL"
          curl -L --fail -o templates.tpz "$TEMPLATES_URL"
          TPL_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          mkdir -p "$TPL_DIR"
          unzip -o templates.tpz -d /tmp/godot-templates
          mv /tmp/godot-templates/templates/* "$TPL_DIR/"
          rm -rf /tmp/godot-templates templates.tpz godot.zip

      - name: Expose Godot on PATH
        run: |
          echo "$HOME/godot-bin" >> $GITHUB_PATH
          echo "GODOT_BIN=$HOME/godot-bin/godot" >> $GITHUB_ENV

      - name: Generate debug keystore
        run: |
          set -e
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Configure Godot editor settings (Android paths + keystore)
        run: |
          set -e
          CFG_DIR="$HOME/.config/godot"
          mkdir -p "$CFG_DIR"
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo ''
            echo '[resource]'
            echo "export/android/android_sdk_path = \"$ANDROID_SDK_ROOT\""
            echo "export/android/debug_keystore = \"$HOME/.android/debug.keystore\""
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_pass = "android"'
            echo 'export/android/force_system_user = false'
            echo 'export/android/shutdown_adb_on_exit = true'
            echo 'export/android/use_wifi_for_remote_debug = false'
          } > "$CFG_DIR/editor_settings-4.tres"
          echo "Editor settings written:"
          cat "$CFG_DIR/editor_settings-4.tres"

      - name: First import pass (build class cache)
        run: |
          cd $GITHUB_WORKSPACE
          $GODOT_BIN --headless --import 2>&1 | tail -50 || true

      - name: Second import pass (resolve cross-script references)
        run: |
          cd $GITHUB_WORKSPACE
          $GODOT_BIN --headless --import 2>&1 | tail -50 || true

      - name: Install Android build template (manual extraction)
        run: |
          set -e
          cd $GITHUB_WORKSPACE

          # The Godot CLI flag --install-android-build-template hangs forever
          # in headless mode on CI (waits for editor context). Instead, we
          # extract android_source.zip directly from the export templates
          # into android/build/ — this is exactly what the CLI does under
          # the hood, minus the hang.
          TPL_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          SOURCE_ZIP="$TPL_DIR/android_source.zip"

          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "::error::android_source.zip not found at $SOURCE_ZIP"
            echo "Available template files:"
            ls -la "$TPL_DIR" || true
            exit 1
          fi

          mkdir -p android/build
          unzip -oq "$SOURCE_ZIP" -d android/build/

          # .gdignore prevents Godot from trying to import Gradle/Java files
          touch android/build/.gdignore

          # version.txt is REQUIRED — the exporter refuses to build without it
          # ("no version info for it exists"). Content must match the engine's
          # full version string exactly (e.g. "4.3.stable.official.77dcf97d8").
          $GODOT_BIN --version | tr -d '\n' > android/build/.install
          mv android/build/.install android/build/version.txt
          echo "version.txt contents: '$(cat android/build/version.txt)'"

          echo "--- android/ tree ---"
          ls -la android/
          echo "--- android/build/ tree (top level) ---"
          ls -la android/build/ | head -30

      - name: Export Android Debug APK
        run: |
          set -e
          cd $GITHUB_WORKSPACE
          mkdir -p build
          $GODOT_BIN --headless --verbose --export-debug "Android Debug" build/porto_santiago-debug.apk
          echo "--- build/ tree ---"
          ls -la build/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: porto-santiago-android-debug
          path: build/porto_santiago-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Job summary
        if: always()
        run: |
          echo "## Porto Santiago — Android Debug Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f build/porto_santiago-debug.apk ]; then
            SIZE=$(du -h build/porto_santiago-debug.apk | cut -f1)
            echo "✅ APK built successfully ($SIZE)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Pra baixar e instalar:**" >> $GITHUB_STEP_SUMMARY
            echo "1. Role pra cima nesta página, na seção *Artifacts*" >> $GITHUB_STEP_SUMMARY
            echo "2. Clique em \`porto-santiago-android-debug\` pra baixar o zip" >> $GITHUB_STEP_SUMMARY
            echo "3. Extraia o .apk no celular" >> $GITHUB_STEP_SUMMARY
            echo "4. Permita \"Instalar de fontes desconhecidas\" pro app que você usou pra abrir" >> $GITHUB_STEP_SUMMARY
            echo "5. Toque no APK e instale" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Build failed — confira os logs acima." >> $GITHUB_STEP_SUMMARY
          fi
