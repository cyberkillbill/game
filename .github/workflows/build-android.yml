name: Build Android (Unity)

# Build automatico do APK Android com Unity via game-ci/unity-builder.
#
# REQUER 3 secrets no repo (Settings → Secrets and variables → Actions):
#   UNITY_LICENSE   — conteúdo do arquivo .ulf (instruções no README)
#   UNITY_EMAIL     — email da conta Unity
#   UNITY_PASSWORD  — senha da conta Unity
#
# Primeiro run vai FALHAR se os secrets não estiverem configurados —
# é esperado. Siga o README.md pra ativar a licença antes do primeiro build.

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**/*.md"
      - ".gitignore"
  workflow_dispatch:

env:
  UNITY_VERSION: "2022.3.40f1"

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Free disk space
        # Unity-builder precisa de muito espaço em disco. ubuntu-22.04
        # vem com várias toolchains que não usamos.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
                       /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-
            Library-

      - name: Build Android APK via Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          androidExportType: androidPackage
          allowDirtyBuild: true

      - name: List build output
        if: always()
        run: |
          echo "--- build/ ---"
          ls -la build/ || true
          echo "--- build/Android/ ---"
          ls -la build/Android/ || true

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: porto-santiago-android-apk
          path: build/Android/
          if-no-files-found: error
          retention-days: 30

      - name: Job summary
        if: always()
        run: |
          echo "## Porto Santiago — Android Build (Unity)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if ls build/Android/*.apk >/dev/null 2>&1; then
            APK=$(ls build/Android/*.apk | head -1)
            SIZE=$(du -h "$APK" | cut -f1)
            echo "✅ APK gerado: \`$APK\` ($SIZE)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Baixe em **Artifacts → porto-santiago-android-apk**." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Build falhou. Veja logs do step **Build Android APK via Unity**." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Erros comuns:**" >> $GITHUB_STEP_SUMMARY
            echo "- Licença Unity não configurada: confira README.md, seção 'Ativar licença Unity'" >> $GITHUB_STEP_SUMMARY
            echo "- ProjectSettings/ ausente: você inicializou o projeto em Unity Hub localmente?" >> $GITHUB_STEP_SUMMARY
          fi
